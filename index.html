<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>새 사이트</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172033; background: #f5f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 680px); padding: clamp(32px, 7vw, 64px); border: 1px solid #e5eaf2; border-radius: 24px; background: white; box-shadow: 0 24px 70px #17203312; }
    .mark { display: grid; place-items: center; width: 52px; height: 52px; margin-bottom: 28px; border-radius: 16px; color: white; background: #315efb; font-size: 25px; }
    h1 { margin: 0 0 14px; font-size: clamp(30px, 6vw, 46px); letter-spacing: -0.04em; }
    p { margin: 0; color: #596579; font-size: 17px; line-height: 1.75; }
    .status { display: inline-flex; align-items: center; gap: 9px; margin-top: 30px; padding: 10px 14px; border-radius: 999px; color: #176b43; background: #eaf8f0; font-size: 14px; font-weight: 600; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #25a568; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✦</div>
    <h1>새 사이트가 준비됐어요</h1>
    <p>이 페이지는 GitHub Pages에 올릴 수 있도록 만든 시작 화면입니다. 원하는 문구와 디자인으로 자유롭게 바꿔 보세요.</p>
    <div class="status"><span class="dot" aria-hidden="true"></span>GitHub Pages 배포용 페이지</div>
  </main>
</body>
</html>
